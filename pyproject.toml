[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-probe"
version = "0.1.1"
description = "Read-only RS485 BMS protocol probe tool with safety gates, JSON transaction logs, and hardware evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]
keywords = ["bms", "rs485", "modbus", "battery", "diagnostics"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bms-probe = "main_cli:main"

[tool.setuptools]
packages = ["core", "transport", "protocols"]
py-modules = ["main_cli", "app_gui"]

[tool.pytest.ini_options]
pythonpath = ["."]
